<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — PIX LFT</title>
  <meta name="theme-color" content="#003B73">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/logos/lft.png">
  <link rel="stylesheet" href="css/marianne.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-bg" aria-hidden="true"></div>

  <div hidden aria-hidden="true" id="ph-sprite-host"></div>
  <script>fetch("assets/icons/sprite.svg").then(r=>r.text()).then(s=>{document.getElementById("ph-sprite-host").innerHTML=s});</script>

  <main class="container" style="display: grid; place-items: center; min-height: 100vh; padding: var(--space-6);">
    <article class="not-found" style="
      max-width: 540px;
      width: 100%;
      padding: clamp(var(--space-7), 6vw, var(--space-9)) clamp(var(--space-5), 4vw, var(--space-8));
      text-align: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(255,255,255,0.82) 100%);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: var(--radius-xl);
      box-shadow:
        0 32px 80px -20px rgba(0, 59, 115, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    ">
      <div aria-hidden="true" style="
        width: 96px;
        height: 96px;
        margin: 0 auto var(--space-5);
        border-radius: 28px;
        background: linear-gradient(135deg, var(--lft-blue), var(--pix-blue));
        color: white;
        display: grid;
        place-items: center;
        box-shadow: 0 16px 40px -8px rgba(61, 104, 255, 0.5), inset 0 1px 0 rgba(255,255,255,0.4);
      ">
        <svg class="icon icon--3xl" style="width: 56px; height: 56px;"><use href="#ph-compass"/></svg>
      </div>

      <div style="
        font-size: 88px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.05em;
        background: linear-gradient(135deg, var(--lft-blue), var(--lft-magenta));
        -webkit-background-clip: text;
                background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: var(--space-3);
        font-feature-settings: 'ss01', 'tnum';
      ">404</div>

      <h1 style="
        font-size: var(--text-2xl);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: var(--space-3);
      ">Page introuvable</h1>

      <p style="color: var(--text-secondary); margin: 0 0 var(--space-7); line-height: 1.6;">
        Cette page n'existe pas, a été déplacée, ou n'est plus disponible.
        Aucune inquiétude&nbsp;: revenez à l'accueil pour retrouver vos résultats Pix.
      </p>

      <a href="index.html" class="btn btn--primary">
        <svg class="icon"><use href="#ph-arrow-left"/></svg>
        Retour à l'accueil
      </a>
    </article>
  </main>
</body>
</html>
